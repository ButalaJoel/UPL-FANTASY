services:
  db:
    image: postgres:16-alpine
    container_name: kiwanja-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kiwanja
      POSTGRES_PASSWORD: kiwanja
      POSTGRES_DB: kiwanja
    ports:
      - "5432:5432"
    volumes:
      - kiwanja-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiwanja"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  kiwanja-pg:
